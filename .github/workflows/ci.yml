name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.stability }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11', '12', '13']
        stability: [prefer-stable]
        include:
          - laravel: '11'
            testbench: '^9.9'
          - laravel: '12'
            testbench: '^10.0'
          - laravel: '13'
            testbench: '^11.0'
          # Lowest supported versions at the edges of the matrix (spec §2).
          - php: '8.2'
            laravel: '11'
            testbench: '^9.9'
            stability: prefer-lowest
          - php: '8.4'
            laravel: '13'
            testbench: '^11.0'
            stability: prefer-lowest
        exclude:
          # Laravel 13 requires PHP 8.3+.
          - php: '8.2'
            laravel: '13'

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, fileinfo
          coverage: none

      - name: Install dependencies
        # Every Laravel 11 release (and the lowest 12/13 releases) carries a Packagist security
        # advisory; Composer blocks such versions by default. The package supports them, so they
        # are installed for testing anyway.
        env:
          COMPOSER_NO_BLOCKING: 1
          COMPOSER_NO_SECURITY_BLOCKING: 1
        run: |
          composer require "laravel/framework:^${{ matrix.laravel }}.0" --no-interaction --no-update
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Installed versions
        run: composer show | grep -E '^(laravel/framework|orchid/platform|orchestra/testbench|pestphp/pest|larastan/larastan|phpunit/phpunit) '

      - name: Pest
        run: vendor/bin/pest --ci

      - name: Larastan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github

      - name: Pint
        run: vendor/bin/pint --test

      - name: Adapter check (Orchid names only in src/Support/Orchid.php)
        run: php bin/check-adapter.php
